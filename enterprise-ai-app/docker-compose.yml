services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333", "6334:6334"]
    volumes: ["./qdrant_storage:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
